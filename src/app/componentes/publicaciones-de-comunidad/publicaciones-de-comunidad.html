<app-header></app-header>

<main class="container my-4">

    <div class="bulk-card p-4">

        <h2 class="title mb-3">Carga Masiva de Datos</h2>
        <p class="subtitle mb-4">
            Seleccione el archivo y el tipo de entidad que desea cargar masivamente.
        </p>

        <!-- FORMULARIO -->
        <form>

            <!-- SELECCIÓN DEL TIPO -->
            <div class="form-group mb-3">
                <label class="form-label">Tipo de entidad</label>
                <select class="form-select">
                    <option value="" disabled selected>Seleccione un tipo...</option>
                    <option value="USER">Usuarios</option>
                    <option value="POST">Publicaciones</option>
                    <option value="COMMUNITY">Comunidades</option>
                    <option value="SERVICE">Servicios</option>
                </select>
            </div>

            <!-- INPUT ARCHIVO -->
            <div class="form-group mb-3">
                <label class="form-label">Archivo (Excel, CSV)</label>
                <input type="file" class="form-control">
            </div>

            <!-- OPCION EXTRA -->
            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="keepFile">
                <label class="form-check-label" for="keepFile">
                    Conservar archivo si hay errores
                </label>
            </div>

            <!-- BOTÓN -->
            <button class="btn-primary w-100 mt-2" type="button">
                Cargar archivo
            </button>

        </form>

    </div>

</main>


<app-footer></app-footer>
