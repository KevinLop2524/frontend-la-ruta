<app-header></app-header>
<main>
  <div class="container">

    <!-- ✅ Formulario para crear publicación -->
    <div class="row" id="bg-form-publicacion">
      <div class="col-12 col-sm-12 col-md-6 col-lg-6 col-xl-6">
        <!-- Campo Contenido -->
        <div class="mb-3">
          <label for="contenido" class="form-label">Contenido</label>
          <input type="text" id="contenido" class="form-control" [(ngModel)]="nuevaPublicacion.contenido"
            name="contenido" placeholder="Escribe el contenido de la publicación">
        </div>

        <!-- Campo Descripción -->
        <div class="mb-3">
          <label for="descripcion" class="form-label">Descripción</label>
          <textarea id="descripcion" class="form-control" [(ngModel)]="nuevaPublicacion.descripcion" name="descripcion"
            rows="5" placeholder="Agrega  una descripción detallada"></textarea>
        </div>

        <!-- Campo Nombre -->
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre</label>
          <input type="text" id="nombre" class="form-control" [(ngModel)]="nuevaPublicacion.nombre" name="nombre"
            placeholder="Escribe tu nombre">
        </div>
      </div>

      <div class="col-12 col-sm-12 col-md-6 col-lg-6 col-xl-6">
        <!-- Campo Categoría -->
        <div class="mb-3">
          <label for="categoria" class="form-label">Categoría</label>
          <input type="text" id="categoria" class="form-control" [(ngModel)]="nuevaPublicacion.categoria"
            name="categoria" placeholder="Categoría de la publicación">
        </div>

        <!-- Campo Fecha -->
        <div class="mb-3">
          <label for="fecha" class="form-label">Fecha</label>
          <input type="date" id="fecha" class="form-control" [(ngModel)]="nuevaPublicacion.fecha" name="fecha">
        </div>

        <!-- Campo Usuario (oculto) -->
        <input type="hidden" [(ngModel)]="nuevaPublicacion.usuario_id" name="usuario_id">
      </div>

      <!-- Botón de creación -->
      <div class="text-center mt-3">
        <button type="button" class="btn btn-danger" (click)="crearPublicacion()">
          Crear publicación
        </button>
      </div>
    </div>


    <!-- ✅ Lista de publicaciones -->
    <div class="row lista-publi" id="post" *ngFor="let pub of publicaciones">
      <!-- Columna izquierda: Publicación -->
      <div class="col-12">
        <div class="p-3 border rounded shadow-sm mb-3">
          <div><h5 class="fw-bold">{{ pub.nombre }}</h5></div>
          <div><h6 class="text-muted">Categoría: {{ pub.categoria }}</h6></div>
          <div><p class="mb-2"><strong>Contenido:</strong> {{ pub.contenido }}</p></div>
          <div><p class="text-secondary"><strong>Descripción:</strong> {{ pub.descripcion }}</p></div>
          <div><p class="small text-muted">📅 {{ pub.fecha | date:'dd/MM/yyyy' }}</p></div>

          <!-- Botones de acción -->
          <div class="d-flex justify-content-between mt-2">
            <button class="btn btn-warning btn-sm" data-bs-toggle="modal" data-bs-target="#modalEditar"
              (click)="abrirEditar(pub)">
              ✏ Editar
            </button>
            <button class="btn btn-danger btn-sm" (click)="eliminarPublicacion(pub.id)">
              🗑 Eliminar
            </button>
          </div>
        </div>
      </div>

      <!-- Columna derecha: Formulario de comentario -->
    </div>

  </div>
</main>


<!-- ✅ Modal para editar publicación -->
<div class="modal fade" id="modalEditar" tabindex="-1" aria-labelledby="modalEditarLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header bg-warning">
        <h5 class="modal-title" id="modalEditarLabel">Editar publicación</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <!-- Formulario dentro del modal -->
        <form>
          <div class="mb-3">
            <label for="editarContenido" class="form-label">Contenido</label>
            <input type="text" id="editarContenido" class="form-control" [(ngModel)]="publicacionEditar.contenido"
              name="editarContenido">
          </div>

          <div class="mb-3">
            <label for="editarDescripcion" class="form-label">Descripción</label>
            <textarea id="editarDescripcion" class="form-control" [(ngModel)]="publicacionEditar.descripcion"
              name="editarDescripcion" rows="4"></textarea>
          </div>

          <div class="mb-3">
            <label for="editarNombre" class="form-label">Nombre</label>
            <input type="text" id="editarNombre" class="form-control" [(ngModel)]="publicacionEditar.nombre"
              name="editarNombre">
          </div>

          <div class="mb-3">
            <label for="editarCategoria" class="form-label">Categoría</label>
            <input type="text" id="editarCategoria" class="form-control" [(ngModel)]="publicacionEditar.categoria"
              name="editarCategoria">
          </div>

          <div class="mb-3">
            <label for="editarFecha" class="form-label">Fecha</label>
            <input type="date" id="editarFecha" class="form-control" [(ngModel)]="publicacionEditar.fecha"
              name="editarFecha">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-success" (click)="actualizarPublicacion(publicacionEditar)"
          data-bs-dismiss="modal">Guardar cambios</button>
      </div>
    </div>
  </div>
</div>
<app-footer></app-footer>
