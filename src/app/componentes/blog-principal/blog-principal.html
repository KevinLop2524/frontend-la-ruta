<app-header></app-header>
<main>
  <div class="container">

    <div class="row">
      <div class="mostrarCont col-12 col-sm-12 col-md-6 col-lg-6 col-xl-6">
        <div class="mb-3">
          <label for="nuevaPublicacionPersonal" class="form-label">¿Algo nuevo?</label>
          <input type="text" class="form-control" id="nuevaPublicacionPersonal"
            placeholder="Describe el contenido, por favor">
        </div>
        <div class="mb-3 oculto">
          <label for="exampleFormControlTextarea1" class="form-label"></label>
          <textarea class="form-control" id="exampleFormControlTextarea1" rows="5"
            placeholder="Descripción de lo que desees comentarnos. Con todo gusto te excuchamos."></textarea>
        </div>
      </div>
      <div class="col-12 col-sm-12 col-md-6 col-lg-6 col-xl-6">
        <div class="mb-3">
          <label for="formFileMultiple" class="form-label">Seleccionar varios archivos</label>
          <input class="form-control" type="file" id="formFileMultiple" multiple>
        </div>

        <div class="mb-3">
          <label for="formFileSm" class="form-label">Seleccionar formato de archivo distinto</label>
          <input class="form-control form-control-sm" id="formFileSm" type="file">
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-12 col-sm-12 col-md-6 col-lg-6 col-xl-6">
        <div id="carouselExample" class="carousel slide">
          <div class="carousel-inner">
            <div class="carousel-item ">
              <img src="/imagenes/static/imgGymUno.jpg" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
              <img src="/imagenes/static/imgGymDos.jpg" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item active">
              <img src="/imagenes/static/imgGymTres.jpg" class="d-block w-100" alt="...">
            </div>
          </div>
          <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Anterior</span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Siguiente</span>
          </button>
        </div>
      </div>
      <div class="col-12 col-sm-12 col-md-6 col-lg-6 col-xl-6">
        <form class="was-validated">
          <div class="mb-3">
            <label for="validationTextarea" class="form-label">Comentar</label>
            <textarea class="form-control" id="validationTextarea" placeholder="¡Hazle un comentario!"></textarea>
            <div class="invalid-feedback">
              Por favor, ingresa un comentario.
            </div>
          </div>

          <div class="form-check">
            <input type="radio" class="form-check-input" id="validationFormCheck2" name="radio-stacked" required
              checked>
            <label class="form-check-label" for="validationFormCheck2">Modo privado</label>
          </div>
          <div class="form-check mb-3">
            <input type="radio" class="form-check-input" id="validationFormCheck3" name="radio-stacked" required>
            <label class="form-check-label" for="validationFormCheck3">Modo público</label>
            <div class="invalid-feedback">More example invalid feedback text</div>
          </div>

          <div class="mb-3">
            <input type="file" class="form-control" aria-label="file example">
            <div class="invalid-feedback">Añade una imagen</div>
          </div>

          <div class="mb-3">
            <button class="btn btn-primary" type="submit" disabled>Submit form</button>
          </div>
        </form>
      </div>
    </div>

    <div class="row">
      <div class="col-12 col-sm-12 col-md-6 col-lg-6 col-xl-6">
        <div id="carruselDos" class="carousel slide">
          <div class="carousel-inner">
            <div class="carousel-item ">
              <img src="/imagenes/static/imgGymUno.jpg" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item active">
              <img src="/imagenes/static/imgGymDos.jpg" class="d-block w-100" alt="...">
            </div>
            <div class="carousel-item">
              <img src="/imagenes/static/imgGymTres.jpg" class="d-block w-100" alt="...">
            </div>
          </div>
          <button class="carousel-control-prev" type="button" data-bs-target="#carruselDos" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Anterior</span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#carruselDos" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Siguiente</span>
          </button>
        </div>
      </div>
      <div class="col-12 col-sm-12 col-md-6 col-lg-6 col-xl-6">
        <form class="was-validated">
          <div class="mb-3">
            <label for="validationTextarea" class="form-label">Comentar</label>
            <textarea class="form-control" id="validationTextarea" placeholder="¡Hazle un comentario!"></textarea>
            <div class="invalid-feedback">
              Por favor, ingresa un comentario.
            </div>
          </div>

          <div class="form-check">
            <input type="radio" class="form-check-input" id="validationFormCheck2" name="radio-stacked" required
              checked>
            <label class="form-check-label" for="validationFormCheck2">Modo privado</label>
          </div>
          <div class="form-check mb-3">
            <input type="radio" class="form-check-input" id="validationFormCheck3" name="radio-stacked" required>
            <label class="form-check-label" for="validationFormCheck3">Modo público</label>
            <div class="invalid-feedback">More example invalid feedback text</div>
          </div>

          <div class="mb-3">
            <input type="file" class="form-control" aria-label="file example">
            <div class="invalid-feedback">Añade una imagen</div>
          </div>

          <div class="mb-3">
            <button class="btn btn-primary" type="submit" disabled>Submit form</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</main>
