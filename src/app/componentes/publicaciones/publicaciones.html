<app-header></app-header>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">Community Name</a>
    <div>
      <button class="btn btn-primary" (click)="openModal()">Crear publicación</button>
    </div>
  </div>
</nav>

<main class="container my-4">
  <section id="feed" class="row gy-3">

    <div class="col-12" *ngFor="let post of posts">
      <div class="post-card">

        <!-- HEADER -->
        <div class="post-header">
          <img class="avatar" [src]="post.avatar" alt="avatar">

          <div>
            <div class="username">{{ post.username }}</div>
            <div class="post-date">{{ post.date }}</div>
          </div>

          <!-- MENÚ 3 PUNTOS -->
          <div class="post-menu-wrapper">

            <button class="post-menu-btn" (click)="toggleMenu(post)">⋮</button>

            <!-- MENÚ -->
            <div
              class="custom-menu"
              *ngIf="post.menuOpen"
            >
              <button class="dropdown-item btn-edit">✏️ Editar</button>
              <button class="dropdown-item btn-delete">🗑️ Eliminar</button>
            </div>

          </div>

        </div>

        <!-- CONTENIDO -->
        <div class="post-content mt-3">
          {{ post.content }}
        </div>

        <!-- IMAGEN -->
        <img *ngIf="post.image" class="post-image" [src]="post.image" alt="post image">

        <!-- ACCIONES -->
        <div class="post-actions">
          <button class="action-btn">❤ {{ post.likes }}</button>
          <button class="action-btn">💬 Comentar</button>
          <button class="action-btn">↗ Compartir</button>
        </div>

      </div>
    </div>

  </section>
</main>

<!-- MODAL PUBLICACIÓN -->
<div class="modal fade" tabindex="-1" #modalPublicacion>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rounded-4 shadow border-0">

      <div class="modal-header border-0">
        <h5 class="modal-title">Crear publicación</h5>
        <button type="button" class="btn-close" (click)="closeModal()"></button>
      </div>

      <div class="modal-body">
        <form>

          <!-- CONTENIDO -->
          <div class="mb-3">
            <label class="form-label">Contenido</label>
            <textarea
              [(ngModel)]="newPostContent"
              name="contenido"
              class="form-control form-control-lg"
              rows="4"
              placeholder="Comparte algo..."
            ></textarea>
          </div>

          <!-- IMAGEN -->
          <div class="mb-3">
            <label class="form-label">Imagen</label>

            <input
              type="file"
              #fileInput
              class="d-none"
              accept="image/*"
              (change)="onImageSelect($event)"
            >

            <div class="drop-zone" (click)="fileInput.click()">
              <div class="drop-zone-content">
                <svg width="32" height="32" viewBox="0 0 24 24">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                  <polyline points="17 8 12 3 7 8"></polyline>
                  <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                <p>Haz clic para subir una imagen</p>
              </div>
            </div>

            <div *ngIf="imagePreview" class="mt-3">
              <img [src]="imagePreview" class="img-fluid rounded" style="max-height: 200px;">
            </div>

          </div>

        </form>
      </div>

      <div class="modal-footer border-0">
        <button type="button" class="btn btn-link text-muted" (click)="closeModal()">Cancelar</button>
        <button type="button" class="btn btn-primary" (click)="publish()">Publicar</button>
      </div>

    </div>
  </div>
</div>

<app-footer></app-footer>
