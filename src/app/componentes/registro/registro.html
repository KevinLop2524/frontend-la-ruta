<div class="contenedor-registro">

  <div class="card-registro">

<img src="imagenes/logos/New_Logo_Modo_Claro.png" class="logo-registro-form" alt="logo">

    <h2 class="titulo-registro">Registro</h2>

    <div *ngIf="step === 1" class="form-paso">

      <label>Correo electrónico</label>
      <input
        type="email"
        [(ngModel)]="formStep1.email"
        class="input"
        placeholder="Ingresa tu correo"
      >

      <label>Nombre de usuario</label>
      <input
        type="text"
        [(ngModel)]="formStep1.username"
        class="input"
        placeholder="Elige un nombre de usuario"
      >

      <label>Contraseña</label>
      <input
        type="password"
        [(ngModel)]="formStep1.password"
        class="input"
        placeholder="Ingresa tu contraseña"
      >

      <label>Confirmar contraseña</label>
      <input
        type="password"
        [(ngModel)]="formStep1.password2"
        class="input"
        placeholder="Repite tu contraseña"
      >

      <button class="btn-siguiente" (click)="nextStep()">Siguiente</button>
    </div>

    <div *ngIf="step === 2" class="form-paso">

      <label>Nombre</label>
      <input
        type="text"
        [(ngModel)]="formStep2.nombre"
        class="input"
        placeholder="Nombre"
      >

      <label>Segundo nombre (opcional)</label>
      <input
        type="text"
        [(ngModel)]="formStep2.segundoNombre"
        class="input"
        placeholder="Segundo nombre"
      >

      <label>Apellido</label>
      <input
        type="text"
        [(ngModel)]="formStep2.apellido"
        class="input"
        placeholder="Apellido"
      >

      <label>Segundo apellido (opcional)</label>
      <input
        type="text"
        [(ngModel)]="formStep2.segundoApellido"
        class="input"
        placeholder="Segundo apellido"
      >

      <label>Peso (kg)</label>
      <input
        type="number"
        [(ngModel)]="formStep2.peso"
        class="input"
        placeholder="Ej: 70"
      >

      <label>Altura (cm)</label>
      <input
        type="number"
        [(ngModel)]="formStep2.altura"
        class="input"
        placeholder="Ej: 175"
      >

      <label>Género</label>
      <select class="input" [(ngModel)]="formStep2.genero">
        <option value="">Selecciona…</option>
        <option value="M">Masculino</option>
        <option value="F">Femenino</option>
        <option value="O">Otro</option>
      </select>

      <button class="btn-registrar" (click)="register()">Registrar</button>
      <button class="btn-volver" (click)="prevStep()">Volver</button>

    </div>

  </div>

</div>
