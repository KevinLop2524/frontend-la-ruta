<main class="register-wrapper">
    <div class="register-card">

        <img src="/imagenes/logos/New_Logo_Modo_Claro.png" class="logo">

        <h2 class="title">Crear cuenta</h2>
        <p class="subtitle">Completa tus datos para continuar</p>

        <form class="formulario" novalidate>

            <!-- Nombre -->
            <div class="form-group">
                <label>Nombre</label>
                <input type="text" class="input" [(ngModel)]="firstName" name="firstName" required>
            </div>

            <!-- Apellido -->
            <div class="form-group">
                <label>Apellido</label>
                <input type="text" class="input" [(ngModel)]="lastName" name="lastName" required>
            </div>

            <!-- Username -->
            <div class="form-group">
                <label>Nombre de usuario</label>
                <input type="text" class="input" [(ngModel)]="username" name="username" required>
            </div>

            <!-- Correo -->
            <div class="form-group">
                <label>Correo electrónico</label>
                <input type="email" class="input" [(ngModel)]="email" name="email" required>
            </div>

            <!-- Fecha de nacimiento -->
            <div class="form-group">
                <label>Fecha de nacimiento</label>
                <input type="date" class="input" [(ngModel)]="dateOfBirth" name="dateOfBirth" required>
            </div>

            <!-- Contraseña -->
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" class="input" [(ngModel)]="password" name="password" required>
                <small class="hint">
                    Debe tener entre 10 y 15 caracteres, con al menos 2 minúsculas, 1 mayúscula y 2 números.
                </small>
            </div>

            <!-- Verificación -->
            <div class="form-group">
                <label>Confirmar contraseña</label>
                <input type="password" class="input" [(ngModel)]="password2" name="password2" required>
            </div>

            <!-- Botón -->
            <button class="btn-register" type="button" (click)="registrar()">
                Registrarse
            </button>

            <p class="login-link">
                ¿Ya tienes cuenta?
                <a routerLink="/">Inicia sesión</a>
            </p>

        </form>
    </div>
</main>
