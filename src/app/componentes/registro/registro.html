<main>
    <div class="container formulario-angosto" id="container">
        <div>
            <img src="/imagenes/logos/New_Logo_Modo_Claro.png" id="logo">
        </div>
        <h2 class="text-center  mb-2 " id="texto">Registro</h2>
        <form action="registro2.html" id="R-FR-Datos" method="get" class="needs-validation" novalidate>
            <div class="row mb-300">
                <div class="col-md-6">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="nombre" name= "apellido" placeholder="Requerido" [(ngModel)]="nombre"
                        required>
                    <div class="invalid-feedback">Ingresa tu nombre.</div>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="apellido" class="form-label input-group">Apellido</label>
                    <input type="text" class="form-control" id="apellido" name= "apellido" placeholder="Requerido" [(ngModel)]="apellido"
                        required>
                    <div class="invalid-feedback">Ingresa tu apellido.</div>
                </div>
            </div>

            <div class="mb-3">
                <label for="apodo" class="form-label">Nombre de usuario</label>
                <input type="text" class="form-control" id="apodo" name="apodo" placeholder="Requerido" [(ngModel)]="apodo" required>
                <div class="invalid-feedback">Ingresa un correo válido.</div>
            </div>

            <div class="mb-3">
                <label for="correo" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="correo" name="correo" placeholder="Requerido" [(ngModel)]="correo"
                    required>
                <div class="invalid-feedback">Ingresa un correo válido.</div>
            </div>

            <div class="mb-4">
                <label for="contrasena" class="form-label">Ingresa una contraseña</label>
                <input type="password" class="form-control" id="contrasena" name="constrasena" placeholder="Requerido" [(ngModel)]="contrasena" required>
                <div class="invalid-feedback">Ingresa una contraseña.</div>
                <div id="emailHelp" class="form-text">La contraseña debe tener entre 10 y 15 caracteres, con al menos 2
                    minúsculas, 1 mayúscula y 2 números.</div>
            </div>

            <div class="mb-4">
                <label for="contrasenaDos" class="form-label">Verefica la contraseña.</label>
                <input type="password" class="form-control" name="contrasenaDos" id="contrasenaDos" placeholder="Requerido"
                    [(ngModel)]="contrasena2" required>
                <div class="invalid-feedback">Verefica la contraseña.</div>
            </div>

            <div class="text-center">
                <button type="button" class="btn btn-primary" id="button" (click)="registrar()">Registrarse</button>
            </div>
            <br>
            <div class="text-center">
                <a class="btn btn-secondary" routerLink="/">Ir a iniciar sesión</a>
            </div>

        </form>
    </div>
