<div class="contenedor-registro">

  <div class="card-registro">

    <img src="imagenes/logos/New_Logo_Modo_Claro.png" class="logo-registro-form" alt="logo">

    <h2 class="titulo-registro">Registro</h2>

    <!-- PASO 1 -->
    <div *ngIf="step === 1" class="form-paso">

      <label>Correo electrónico</label>
      <input
        type="email"
        [(ngModel)]="this.usuario.email"
        class="input"
        placeholder="Ingresa tu correo"
      >

      <label>Nombre de usuario</label>
      <input
        type="text"
        [(ngModel)]="this.usuario.username"
        class="input"
        placeholder="Elige un nombre de usuario"
      >

      <label>Contraseña</label>
      <input
        type="password"
        [(ngModel)]="this.usuario.password"
        class="input"
        placeholder="Ingresa tu contraseña"
      >

      <label>Confirmar contraseña</label>
      <input
        type="password"
        [(ngModel)]="contrasena2"
        class="input"
        placeholder="Repite tu contraseña"
      >

      <button class="btn-siguiente" (click)="nextStep()">Siguiente</button>
    </div>

    <!-- PASO 2 -->
    <div *ngIf="step === 2" class="form-paso">

      <label>Nombre</label>
      <input
        type="text"
        [(ngModel)]="this.usuario.firstName"
        class="input"
        placeholder="Nombre"
      >

      <label>Apellido</label>
      <input
        type="text"
        [(ngModel)]="this.usuario.lastName"
        class="input"
        placeholder="Apellido"
      >

      <!-- NUEVO CAMPO -->
      <label>Fecha de nacimiento</label>
      <input
        type="date"
        [(ngModel)]="this.usuario.dateOfBirth"
        class="input"
      >

      <label>Género</label>
      <select class="input" [(ngModel)]="this.usuario.gender">
        <option value="">Selecciona…</option>
        <option value="M">Masculino</option>
        <option value="F">Femenino</option>
      </select>

      <button class="btn-registrar" (click)="registrar()">Registrar</button>
      <button class="btn-volver" (click)="prevStep()">Volver</button>

    </div>

  </div>

</div>
