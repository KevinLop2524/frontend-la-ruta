<app-header></app-header>
<main>
    <div class="container">
        <br>
        <h2 class="mb-4">Editar Perfil</h2>

        <form>
            <!-- FOTO DE PERFIL -->
            <div class="text-center mb-4">
                <img id="previewFoto" src="imagenes/static/Fotoperfil.jpg" class="rounded-circle border" width="150"
                    height="150" alt="Foto de perfil">
                <div class="mt-2">
                    <label for="fotoPerfil" class="btn btn-outline-primary btn-sm">
                        Cambiar foto
                    </label>
                    <input class="form-control d-none" type="file" id="fotoPerfil" accept="image/*">
                </div>
            </div>

            <!-- DATOS BÁSICOS -->
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control" name="firstName" id="firstName"
                        placeholder="Ingresa tu primer nombre" [(ngModel)]="perfilEditar.firstName">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="nombre2" class="form-label">Segundo nombre</label>
                    <input type="text" class="form-control" name="secondName" id="nombre2"
                        placeholder="Ingresa tu segundo nombre" [(ngModel)]="perfilEditar.secondName">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="apellido" class="form-label">Apellido</label>
                    <input type="text" class="form-control" name="lastName" id="apellido"
                        placeholder="Ingresa tu primer apellido" [(ngModel)]="perfilEditar.lastName">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="apellido2" class="form-label">Segundo apellido</label>
                    <input type="text" class="form-control" name="secondLastName" id="apellido2"
                        placeholder="Ingresa tu segundo apellido" [(ngModel)]="perfilEditar.secondLastName">
                </div>

                <div class="col-md-6 mb-3">
                    <label for="nacimiento" class="form-label">Fecha de nacimiento</label>
                    <input type="date" class="form-control" name="dateOfBirth" id="nacimiento"
                        [(ngModel)]="perfilEditar.dateOfBirth" [min]="fechaMinima()" [max]="fechaMaxima()">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="altura" class="form-label">Altura (cm)</label>
                    <input type="text" class="form-control" name="height" id="altura" placeholder="Ej: 175"
                        [(ngModel)]="perfilEditar.height">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="peso" class="form-label">Peso (kg)</label>
                    <input type="text" class="form-control" name="weight" id="peso" placeholder="Ej: 64"
                        [(ngModel)]="perfilEditar.weight">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="sexo" class="form-label">Sexo</label>
                    <select id="sexo" class="form-select" name="gender" [(ngModel)]="perfilEditar.gender">
                        <option [ngValue]="null">Selecciona tu sexo</option>
                        <option value="M">Hombre</option>
                        <option value="F">Mujer</option>

                    </select>
                </div>
            </div>

            <div class="mb-3">
                <button class="btn btn-primary" (click)="actualizarPerfil()">Guardar cambios</button>
            </div>
        </form>
    </div>
</main>

<app-footer></app-footer>
