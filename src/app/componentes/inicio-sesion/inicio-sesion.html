<div class="lr-root">

  <div class="lr-left">
    <div class="lr-bg"></div>

    <div class="lr-logo">
      <img src="imagenes/logos/New_Logo_Modo_Claro.png" alt="Logo La Ruta" class="lr-logo-img">
    </div>

    <div class="lr-hero">
      <div class="lr-hero-title">
        <span class="white">Forja tu<br></span>
        <span class="orange">mejor<br></span>
        <span class="white">versión.</span>
      </div>
      <div class="lr-hero-sub">Fitness &amp; Comunidad</div>
    </div>
  </div>

  <div class="lr-right">
    <h1 class="lr-title">Bienvenido</h1>
    <p class="lr-subtitle">Inicia sesión para continuar</p>

    <form id="IS-FV-datos" class="lr-form">

      <div class="lr-field">
        <label class="lr-label" for="IS-FV-usuario">Apodo</label>
        <input
          type="text"
          id="IS-FV-usuario"
          class="lr-input"
          placeholder="Tu apodo"
          [(ngModel)]="identifier"
          name="identifier"
          required>
      </div>

      <div class="lr-field">
        <label class="lr-label" for="IS-FV-contrasena">Contraseña</label>
        <input
          type="password"
          id="IS-FV-contrasena"
          class="lr-input"
          placeholder="••••••••"
          [(ngModel)]="contrasena"
          name="contrasena"
          required>
      </div>

      <button type="button" class="lr-btn" (click)="iniciar()">
        Iniciar sesión
      </button>

    </form>



    <hr class="lr-divider" />

    <p class="lr-register">
      ¿Nuevo aquí?
      <a routerLink="/registro" class="lr-register-link">Crea una cuenta</a>
    </p>

  </div>
</div>
