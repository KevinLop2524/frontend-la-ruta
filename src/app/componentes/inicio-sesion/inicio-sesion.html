
<div class="container">
  <div class="row g-4 align-items-center justify-content-center">

    <div class="col-12 col-lg-6 text-center">
      <img src="/imagenes/logos/New_Logo_Modo_Claro.png" alt="Logo La Ruta" class="img-fluid"
        id="imagenInicio">
    </div>

    <div class="col-12 col-lg-5">
      <div class="card py-4 px-3 px-md-5 color-fondo shadow">
        <form id="IS-FV-datos" class="row g-3 justify-content-center">

          <div class="col-12 text-center">
            <h1 id="textoInicio" class="mb-3">Iniciar sesión</h1>
          </div>

          <div class="col-12 col-sm-9 col-md-10">
            <input type="text" id="IS-FV-usuario" class="form-control" placeholder="Apodo" [(ngModel)]="apodo" name="apodo" required>
          </div>

          <div class="col-12 col-sm-9 col-md-10">
            <input type="password" id="IS-FV-contrasena" class="form-control" placeholder="Contraseña" [(ngModel)]="contrasena" name="contrasena" required>
          </div>

          <div class="col-12 text-center mt-3">
            <button type="button" class="btn btn-primary px-5 py-2" (click)="iniciar()">
              Iniciar Sesión
            </button>
          </div>
          <div class="col-12 text-center mt-3" id="link">
            <a routerLink="/" class="recordar-link nuevoUsuario">¿Olvidaste tu cuenta?</a>
          </div>
          <div class="col-12 text-center mt-3" id=link>
            <a routerLink="/registro" class="nuevoUsuario">Crea una cuenta</a>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>
