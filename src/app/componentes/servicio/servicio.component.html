<app-header></app-header>

    <nav class="navbar navbar-expand-lg mb-4"
        style="background:linear-gradient(90deg,var(--primary),var(--secondary));">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center text-white" href="./index.html">
                <img src="../../resources/New_Logo_Modo_Claro.png" alt="logo">
                <span class="ms-2 fs-5 fw-bold">La Ruta</span>
            </a>
            <div class="d-flex gap-2 align-items-center">
                <input id="globalSearch" class="form-control form-control-sm search-input"
                    placeholder="Buscar publicaciones..." style="width:220px">
                <button id="themeToggle" class="btn btn-light btn-sm btn-theme">Modo oscuro</button>
            </div>
        </div>
    </nav>

    <main class="container feed">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="m-0">Inicio</h3>
            <div>
                <button class="btn btn-outline-primary me-2"
                    onclick="location.href='comunidades.html'">Comunidades</button>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newPostModal"><i
                        class="bi bi-plus-lg"></i> Nueva</button>
            </div>
        </div>

        <div id="postsList" class="mb-5"></div>
    </main>

    <div class="modal fade" id="newPostModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Crear publicación</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input id="postTitle" class="form-control mb-2" placeholder="Título (opcional)">
                    <textarea id="postText" class="form-control mb-2" rows="3"
                        placeholder="¿Qué quieres compartir?"></textarea>
                    <input id="postImg" class="form-control" placeholder="URL imagen (opcional)">
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-primary" onclick="createPost()">Publicar</button>
                </div>
            </div>
        </div>
        <div class="card-svc">
            <div class="d-flex justify-content-between">
                <h5>Kevin</h5><small class="text-muted">Kevin</small>
            </div>
            <p class="small text-muted">Hola a todos VLLC</p>
            <div class="d-flex gap-2">
                <button class="btn btn-sm btn-outline-primary" onclick='openSvc("${s.id}")'>Abrir</button>
                <button class="btn btn-sm btn-danger" onclick='delSvc("${s.id}")'>Eliminar</button>
            </div>
        </div>
    </div>

    <app-footer></app-footer>
