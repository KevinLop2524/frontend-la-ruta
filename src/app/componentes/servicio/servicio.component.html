<app-header></app-header>

<main class="container-main">

  <div class="d-flex justify-content-end mb-3">
  <a [routerLink]="['/crear-servicio', idComunidad]" class="btn btn-outline-danger btn-lg">
  Ver servicios
</a>
</div>

  <h1 class="card-title" *ngIf="servicios.length > 0">{{ servicios[0]?.name }}</h1>
  <h1 class="card-title" *ngIf="servicios.length === 0">No hay servicios disponibles</h1>

  <div class="charts-container" *ngIf="servicios.length > 0">

    <div class="chart-box">
      <h3>Progreso Diario</h3>
      <svg viewBox="0 0 300 200">
        <line *ngFor="let y of [160,120,80]" x1="0" [attr.y1]="y" x2="300" [attr.y2]="y" stroke="#ffcdd2"
          stroke-width="2" />
        <text *ngFor="let label of ['70kg','69kg','68kg']; let i = index" x="5" [attr.y]="[160,120,80][i]+5"
          font-size="12" fill="#d32f2f">{{ label }}</text>

        <polyline fill="none" stroke="#d32f2f" stroke-width="4"
          points="10,150 50,130 90,140 130,110 170,100 210,70 250,60 290,40" />
        <circle
          *ngFor="let p of [{x:10,y:150},{x:50,y:130},{x:90,y:140},{x:130,y:110},{x:170,y:100},{x:210,y:70},{x:250,y:60},{x:290,y:40}]"
          [attr.cx]="p.x" [attr.cy]="p.y" r="4" fill="#d32f2f" />
      </svg>
    </div>

    <div class="chart-box">
      <h3>Progreso Mensual</h3>
      <svg viewBox="0 0 300 200">
        <text *ngFor="let label of ['0kg','1kg','2kg','3kg']; let i = index" x="10" [attr.y]="[165,125,85,45][i]"
          font-size="12" fill="#d32f2f">{{ label }}</text>

        <rect
          *ngFor="let bar of [{x:40,y:120,width:30,height:60,mes:'Ene'},{x:100,y:90,width:30,height:90,mes:'Feb'},{x:160,y:70,width:30,height:110,mes:'Mar'},{x:220,y:40,width:30,height:140,mes:'Abr'}]"
          [attr.x]="bar.x" [attr.y]="bar.y" [attr.width]="bar.width" [attr.height]="bar.height" fill="#d32f2f" />
        <text *ngFor="let bar of [{x:40,mes:'Ene'},{x:100,mes:'Feb'},{x:160,mes:'Mar'},{x:220,mes:'Abr'}]"
          [attr.x]="bar.x" y="190" font-size="12">{{ bar.mes }}</text>
      </svg>
    </div>
  </div>

  <div class="notes-section">
    <div class="saved-notes" *ngIf="servicios.length > 0">
      <h4>Servicio</h4>
      <p><strong>Nombre:</strong> {{ servicios[0]?.name }}</p>
      <p><strong>Descripción:</strong> {{ servicios[0]?.description }}</p>

      <div class="mt-3 d-flex gap-2">
        <button class="btn btn-warning btn-sm" *ngIf="this.comunidad.creatorId == this.usuario.id" (click)="abrirEditar(servicios[0])">
          Editar
        </button>

        <!--<button class="btn btn-danger btn-sm"
              (click)="eliminarServicio(servicios[0].id)">
        Eliminar
      </button> -->
      </div>
    </div>
  </div>


</main>

<div class="modal fade" id="modalServicio" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">
          {{ modalModo === 'crear' ? 'Crear Servicio' : 'Editar Servicio' }}
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input type="text" [(ngModel)]="formServicio.name" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Descripción</label>
          <textarea [(ngModel)]="formServicio.description" class="form-control"></textarea>
        </div>

        <div class="mb-3">
          <label class="form-label">Tipo</label>
          <select [(ngModel)]="formServicio.type" class="form-select">
            <option value="ACTIVIDAD_FISICA">Actividad Física</option>
            <option value="NUTRICION">Nutrición</option>
            <option value="DEPORTE">Deporte</option>

          </select>
        </div>

      </div>

      <div class="modal-footer">

        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          Cancelar
        </button>

        <button type="button" class="btn btn-primary" (click)="guardarModal()">
          {{ modalModo === 'crear' ? 'Crear' : 'Actualizar' }}
        </button>

      </div>

    </div>
  </div>
</div>

<app-footer></app-footer>
