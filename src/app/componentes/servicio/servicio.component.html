<app-header></app-header>

<main class="container-main">

  <div *ngIf="usuario.id === comunidad.creatorId" class="d-flex justify-content-end mb-3">
    <button id="createServiceButton" class="btn btn-danger btn-lg" (click)="abrirCrear()">
      ➕ Crear Servicio
    </button>
  </div>


  <h1 class="card-title" *ngIf="servicios.length > 0">Servicios de la comunidad</h1>
  <h1 class="card-title" *ngIf="servicios.length === 0">No hay servicios disponibles</h1>

  <div class="notes-section" *ngIf="servicios.length > 0">
    <div class="saved-notes service-card" *ngFor="let servicio of servicios">

      <div class="service-image">
        <img src="https://images.unsplash.com/photo-1518611012118-f0c5a4c0bf5d" alt="Imagen del servicio" />
      </div>

      <div class="service-content">
        <h4>{{ servicio.name }}</h4>
        <p class="service-description">
          {{ servicio.description }}
        </p>

        <div class="service-actions">
          <button class="btn btn-outline-primary btn-sm" [routerLink]="['/servicios-graficos', servicio.userId]">
            Ver detalles
          </button>


          <div class="post-menu-wrapper" *ngIf="comunidad.creatorId == usuario.id">
            <button class="btn btn-link text-dark fs-4 p-0" (click)="toggleMenu(servicio.id)">
              ⋮
            </button>

            <div class="custom-menu" *ngIf="menuOpenId === servicio.id">
              <button class="dropdown-item btn-edit" (click)="abrirEditar(servicio)">✏️ Editar</button>
              <button class="dropdown-item btn-delete" (click)="eliminarServicio(servicio.id)">🗑️ Eliminar</button>
            </div>
          </div>
        </div>
      </div>

    </div>

  </div>

</main>

<div class="modal fade" id="modalServicio" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">{{ modalModo === 'crear' ? 'Crear Servicio' : 'Editar Servicio' }}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input type="text" [(ngModel)]="formServicio.name" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Descripción</label>
          <textarea [(ngModel)]="formServicio.description" class="form-control"></textarea>
        </div>

        <div class="mb-3" *ngIf="usuario.id === comunidad.creatorId">
          <label class="form-label">Asignar servicio a</label>
          <select [(ngModel)]="formServicio.userId" class="form-select">
            <option value="">Seleccione un usuario...</option>
            <option *ngFor="let u of miembrosComunidad" [value]="u.id">
              {{ u.username }}
            </option>
          </select>
        </div>


        <div class="mb-3">
          <label class="form-label">Tipo</label>
          <select [(ngModel)]="formServicio.type" class="form-select">
            <option value="ACTIVIDAD_FISICA">Actividad Física</option>
            <option value="NUTRICION">Nutrición</option>
            <option value="DEPORTE">Deporte</option>
          </select>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" (click)="guardarModal()">
          {{ modalModo === 'crear' ? 'Crear' : 'Actualizar' }}
        </button>
      </div>

    </div>
  </div>
</div>

<app-footer></app-footer>
